version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskmanager-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: taskmanager-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: taskmanager-worker
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app worker -l INFO

  beat:
    build: .
    container_name: taskmanager-beat
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app beat -l INFO

  bot:
    build: .
    container_name: taskmanager-bot
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: python -m bot.main

volumes:
  postgres_data:
