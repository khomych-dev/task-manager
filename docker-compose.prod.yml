services:
  db:
    image: postgres:17
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build: .
    restart: always
    # Запускаємо сервер, дозволяючи підключення ззовні
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips="*"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      # Перевизначаємо URL, щоб API зверталося до контейнерів 'db' та 'redis', а не до localhost
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    restart: always
    command: uv run celery -A app.workers.tasks.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
